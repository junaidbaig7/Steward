[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward-common"
version = "1.0.0"
description = "Shared configuration, database guards and security helpers for STEWARD services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["steward_common*"]
